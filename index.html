    document.getElementById('marks-share').classList.toggle('hidden', m === 'pins');
    closePopup();
    refreshPoints();
  }
  function renderMarksList() {
    if (mode === 'pins') { renderPinsList(); return; }
    const ids = Object.keys(marks).filter(id => hasMark(id, mode) && byId[id]);
    if (!ids.length) { marksListEl.innerHTML = `<div class="empty">${MODE_EMPTY[mode]}</div>`; return; }
    // Classement : région puis nom
    ids.sort((a, b) => {
      const la = byId[a].get('loc'), lb = byId[b].get('loc');
      return (regionById[la.r] || '').localeCompare(regionById[lb.r] || '', 'fr') || la.t.localeCompare(lb.t, 'fr');
    });
    marksListEl.innerHTML = ids.map(id => {
      const f = byId[id], l = f.get('loc'), m = markOf(id), c = catById[l.c];
      const b = (m.fav ? '<span class="f">★</span>' : '') + (m.st === 'todo' ? ' <span class="o">◎</span>' : '') + (m.st === 'done' ? ' <span class="d">✓</span>' : '');
      return `<div class="mk" data-id="${id}">${badgeHtml(f.get('color'), f.get('icon'))}
        <div><div class="t">${esc(l.t)}</div><div class="s">${esc(c.title)} · ${esc(regionById[l.r] || '')}</div></div>
        <span class="badges">${b}</span></div>`;
    }).join('');
  }
  // Aller à un lieu : centre la carte, zoome si besoin et ouvre la fiche.
  // Si sa catégorie était masquée, on la ré-affiche pour que le point soit visible.
  // Liste des catégories reconstruite (après le tri par prix)
  function rebuildCategoryList() {
    const folded = [...listEl.querySelectorAll('.grp.collapsed')].map(g => g.dataset.g);
    buildPanel();
    listEl.prepend(placeBox);
    folded.forEach(id => { const g = listEl.querySelector('.grp[data-g="' + id + '"]'); if (g) g.classList.add('collapsed'); });
    searchEl.dispatchEvent(new Event('input'));
  }

  // --- Véhicules triés par prix de revente ---
  const priceOf = (l) => { const m = (l.dEn || '').match(/\*\*Sell Value:?\*\*:?\s*\$?([\d,]+)/); return m ? +m[1].replace(/,/g, '') : null; };
  const typeOf = (l) => { const m = (l.d || '').match(/\*\*Type ?:\*\*\s*([^\n]+)/); return m ? m[1].trim() : ''; };
  const typeEnOf = (l) => { const m = (l.dEn || '').match(/\*\*Type:?\*\*:?\s*([^\n]+)/); return m ? m[1].trim() : ''; };
  const PRICE_KINDS = {
    boat: ['Riverboat', 'Personal Watercraft', 'Powerboat'],
    air: ['Plane', 'Helicopter'],
    bike: ['Chopper', 'Bicycle', 'Scooter', 'Superbike', 'Dirtbike', 'Quad Bike']
  };
  const kindOfType = (t) => Object.keys(PRICE_KINDS).find(k => PRICE_KINDS[k].includes(t)) || 'car';
  const PRICE_FILTERS = [['all', 'Tous'], ['car', 'Voitures'], ['bike', 'Motos'], ['boat', 'Bateaux'], ['air', 'Avions']];
  let priceFilter = 'all';
  function showPriceList() {
    const items = allFeatures.filter(f => PRICE_CATS.has(catById[f.get('loc').c].en))
      .map(f => { const l = f.get('loc'); return { f, l, p: priceOf(l), kind: kindOfType(typeEnOf(l)) }; })
      .filter(it => priceFilter === 'all' || it.kind === priceFilter)
      .sort((a, b) => (b.p ?? -1) - (a.p ?? -1) || a.l.t.localeCompare(b.l.t, 'fr'));
    const fmt = (n) => '$' + n.toLocaleString('fr-CH');
    listEl.innerHTML = `<div class="price-head"><b>Véhicules par prix de revente</b><button class="mini-btn" data-price-back>← Catégories</button></div>
      <div class="price-filter">${PRICE_FILTERS.map(([k, t]) => `<button data-pf="${k}" class="${k === priceFilter ? 'sel' : ''}">${t}</button>`).join('')}</div>` +
      (items.length ? items.map(({ f, l, p }) => {
        const c = catById[l.c], ty = typeOf(l);
        return `<div class="mk res" data-id="${l.id}">${badgeHtml(f.get('color'), f.get('icon'))}
          <div><div class="t">${esc(l.t)}</div><div class="s">${esc(c.title)}${ty ? ' · ' + esc(ty) : ''}</div></div>
          <span class="price${p == null ? ' none' : ''}">${p == null ? 'prix inconnu' : fmt(p)}</span></div>`;
      }).join('') : '<div class="empty">Aucun véhicule de ce type.</div>');
    listEl.dataset.view = 'price';
  }
  listEl.addEventListener('click', (e) => {
    if (listEl.dataset.view !== 'price') return;
    if (e.target.closest('[data-price-back]')) { delete listEl.dataset.view; rebuildCategoryList(); return; }
    const pf = e.target.closest('[data-pf]');
    if (pf) { priceFilter = pf.dataset.pf; showPriceList(); return; }
    const it = e.target.closest('.mk[data-id]');
    if (it) goToFeature(byId[it.dataset.id]);
  }, true);

  function goToFeature(f) {
    if (!f) return;
    const l = f.get('loc');
    if (mode === 'all' && !enabled.has(l.c)) { enabled.add(l.c); saveEnabled(); syncChecks(); refreshPoints(); }
    if (window.innerWidth <= 600) setSide(false);   // sur téléphone, on libère la carte
    targetRes = null;
    const res = Math.min(view.getResolution(), resForZoom(4.6));
    view.animate({ center: f.getGeometry().getCoordinates(), resolution: res, duration: 450 }, () => openPopup(f));
  }
  marksListEl.addEventListener('click', (e) => {
    const it = e.target.closest('.mk');
    if (it) goToFeature(byId[it.dataset.id]);
  });
  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-mode]');
    if (b) setMode(b.dataset.mode);
  });
  document.querySelectorAll('#show-row input[data-show]').forEach(el => {
    el.checked = show[el.dataset.show];
    el.onchange = () => {
      show[el.dataset.show] = el.checked; saveShow();
      if (el.dataset.show === 'pins') applyPinsVisible(); else refreshPoints();
    };
  });

  // Export / import des marques (sauvegarde dans un fichier)
  document.getElementById('marks-export').onclick = () => {
    const data = { app: 'leonida-carte', version: 1, exported: new Date().toISOString(), marks, pins };
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'leonida-marques-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  const fileEl = document.getElementById('marks-file');
  document.getElementById('marks-import').onclick = () => fileEl.click();
  fileEl.onchange = async () => {
    const file = fileEl.files[0];
    fileEl.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const incoming = data && data.marks && typeof data.marks === 'object' ? data.marks : null;
      const inPins = data && Array.isArray(data.pins) ? data.pins : null;
      if (!incoming && !inPins) throw new Error('format');
      let n = 0;
      for (const id in (incoming || {})) {
        if (!byId[id]) continue;
        const m = incoming[id], cur = markOf(id);
        // Fusion : on garde la marque la plus récente
        if (!marks[id] || (m.t || 0) >= (cur.t || 0)) { marks[id] = m; n++; }
      }
      const k = inPins ? mergePins(inPins) : 0;
      saveMarks(); refreshPoints(); poiLayer.changed(); refreshPins();
      alertMsg(n + ' lieu(x) et ' + k + ' épingle(s) importé(s).');
    } catch (err) {
      alertMsg('Ce fichier n\'est pas un export de marques valide.');
    }
  };
  function alertMsg(t) { document.getElementById('mode-title').innerHTML = (MODE_TITLES[mode] ? MODE_TITLES[mode] + ' · ' : '') + esc(t); }

  // --- Dernière vue : position et zoom mémorisés dans le navigateur ---
  const VIEW_KEY = 'leonida.vue.v1';
  let saveViewTimer = 0;
  map.on('moveend', () => {
    clearTimeout(saveViewTimer);
    saveViewTimer = setTimeout(() => {
      try { localStorage.setItem(VIEW_KEY, JSON.stringify({ c: view.getCenter().map(Math.round), r: view.getResolution() })); } catch (e) {}
    }, 300);
  });
  function restoreView() {
    let v = null;
    try { v = JSON.parse(localStorage.getItem(VIEW_KEY) || 'null'); } catch (e) {}
    if (v && Array.isArray(v.c) && v.r > 0) { view.setResolution(v.r); view.setCenter(v.c); }
    else fitAll(0);
  }

  // --- Liens : #lieu-123 ouvre un lieu ; #partage=… propose d'ajouter les marques d'un ami ---
  function parseShared(str) {
    const out = { fav: [], todo: [], done: [] };
    const keys = { f: 'fav', t: 'todo', d: 'done' };
    decodeURIComponent(str).split(';').forEach(part => {
      const m = part.match(/^([ftd]):([\d,]*)$/);
      if (m) out[keys[m[1]]] = m[2].split(',').filter(Boolean).map(Number).filter(id => byId[id]);
    });
    return out;
  }
  function sharedLinkFromMarks() {
    const f = [], t = [], d = [];
    for (const id in marks) { const m = marks[id]; if (m.fav) f.push(id); if (m.st === 'todo') t.push(id); if (m.st === 'done') d.push(id); }
    return { url: location.origin + location.pathname + '#partage=' + ['f:' + f.join(','), 't:' + t.join(','), 'd:' + d.join(',')].join(';'), n: f.length + t.length + d.length };
  }
  const dialogEl = document.getElementById('dialog'), dialogBox = document.getElementById('dialog-box');
  function closeDialog() { dialogEl.classList.add('hidden'); dialogBox.innerHTML = ''; }
  function offerShared(sh) {
    const nF = sh.fav.length, nT = sh.todo.length, nD = sh.done.length;
    if (!nF && !nT && !nD) { setHash(''); return; }
    dialogBox.innerHTML = `<h3>Lieux partagés par un ami</h3>
      <p>Ce lien contient ${nF} favori(s), ${nT} lieu(x) à visiter et ${nD} lieu(x) visité(s). Que veux-tu ajouter à ta carte ?</p>
      <label><input type="checkbox" id="sh-f" ${nF ? 'checked' : 'disabled'}> Ses favoris → mes favoris (${nF})</label>
      <label><input type="checkbox" id="sh-t" ${nT ? 'checked' : 'disabled'}> Ses lieux à visiter → mes lieux à visiter (${nT})</label>
      <label><input type="checkbox" id="sh-d" ${nD ? '' : 'disabled'}> Ses lieux visités → mes lieux à visiter (${nD})</label>
      <p style="margin-top:10px;font-size:12px;color:var(--muted)">Tes propres marques ne sont jamais remplacées.</p>
      <div class="actions"><button id="sh-no">Ignorer</button><button class="primary" id="sh-yes">Ajouter</button></div>`;
    dialogEl.classList.remove('hidden');
    document.getElementById('sh-no').onclick = () => { closeDialog(); setHash(''); };
    document.getElementById('sh-yes').onclick = () => {
      let added = 0;
      const wantF = document.getElementById('sh-f').checked, wantT = document.getElementById('sh-t').checked, wantD = document.getElementById('sh-d').checked;
      const addFav = (id) => { const m = Object.assign({}, markOf(id)); if (!m.fav) { m.fav = true; m.t = Date.now(); marks[id] = m; added++; } };
      const addTodo = (id) => { const m = Object.assign({}, markOf(id)); if (!m.st) { m.st = 'todo'; m.t = Date.now(); marks[id] = m; added++; } };
      if (wantF) sh.fav.forEach(addFav);
      if (wantT) sh.todo.forEach(addTodo);
      if (wantD) sh.done.forEach(addTodo);
      saveMarks(); closeDialog(); setHash('');
      setSide(true); setMode(wantF && nF ? 'fav' : 'todo');
      document.getElementById('mode-title').innerHTML += ' · ' + added + ' marque(s) ajoutée(s)';
      poiLayer.changed();
    };
  }
  function handleHash() {
    const h = location.hash.replace(/^#/, '');
    let m = h.match(/^lieu-(\d+)$/);
    if (m && byId[m[1]]) { goToFeature(byId[m[1]]); return true; }
    m = h.match(/^partage=(.*)$/);
    if (m) { offerShared(parseShared(m[1])); return true; }
    m = h.match(/^epingle=(-?\d+),(-?\d+)(?:,(.*))?$/);
    if (m) { receiveSharedPin(+m[1], +m[2], m[3] || ''); return true; }
    return false;
  }
  window.addEventListener('hashchange', handleHash);
  document.getElementById('marks-share').onclick = () => {
    const { url, n } = sharedLinkFromMarks();
    const msg = document.getElementById('marks-share-msg');
    if (!n) { msg.textContent = 'Aucune marque à partager pour l\'instant.'; return; }
    shareLink(url, 'Mes lieux sur la carte de Leonida', msg);
  };
  dialogEl.addEventListener('click', (e) => { if (e.target === dialogEl) { closeDialog(); setHash(''); } });

  // ===========================================================================
  // ÉPINGLES posées à la main (comme sur Google Maps)
  // Appui long sur la carte (ou clic droit) : nouvelle épingle avec un petit texte.
  // Gardées dans le navigateur ; partage par lien #epingle=x,y,texte.
  // Coordonnées en « pixels carte » (x vers la droite, y vers le bas), comme les lieux.
  // ===========================================================================
  const PINS_KEY = 'leonida.epingles.v1';
  const PIN_COLOR = '#ff5a5f';
  const PIN_MAX = 300;   // longueur max du texte
  const validPin = (p) => p && typeof p.x === 'number' && typeof p.y === 'number' && isFinite(p.x) && isFinite(p.y);
  const cleanPin = (p) => ({ id: String(p.id), x: Math.round(p.x), y: Math.round(p.y), txt: String(p.txt || '').slice(0, PIN_MAX), t: +p.t || Date.now() });
  let pins = [];
  try { const a = JSON.parse(localStorage.getItem(PINS_KEY) || '[]'); if (Array.isArray(a)) pins = a.filter(p => validPin(p) && p.id).map(cleanPin); } catch (e) { pins = []; }
  const savePins = () => { try { localStorage.setItem(PINS_KEY, JSON.stringify(pins)); } catch (e) {} };
  const newPinId = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  // Import d'un fichier : même id = on garde la version la plus récente
  function mergePins(list) {
    let k = 0;
    list.filter(p => validPin(p) && p.id).map(cleanPin).forEach(p => {
      const i = pins.findIndex(x => x.id === p.id);
      if (i < 0) { pins.push(p); k++; }
      else if (p.t >= pins[i].t) { pins[i] = p; k++; }
    });
    savePins();
    return k;
  }

  // kind : 'own' = épingle enregistrée, 'draft' = en cours de création, 'shared' = reçue par lien
  const PIN_STATE = { own: 'view', draft: 'edit', shared: 'shared' };
  const pinSource = new ol.source.Vector();
  let temp = null;      // épingle pas encore enregistrée (brouillon ou reçue par lien)
  let pinOpen = null;   // épingle dont la fiche est ouverte
  function pinFeature(p, kind) {
    const f = new ol.Feature(new ol.geom.Point([p.x, -p.y]));
    f.set('pin', p); f.set('kind', kind);
    return f;
  }
  // Dessin de l'épingle : goutte rouge, en double résolution (affichée à 50 %)
  const pinUriCache = {};
  function pinUri(dashed, sel) {
    const k = (dashed ? 'd' : '') + (sel ? 's' : '');
    if (!pinUriCache[k]) {
      const stroke = sel || dashed ? '#ffffff' : 'rgba(10,18,24,0.85)';
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="60" height="80" viewBox="0 0 60 80">' +
        `<path d="M30 76C30 76 7 47 7 30a23 23 0 1 1 46 0c0 17-23 46-23 46z" fill="${PIN_COLOR}" stroke="${stroke}" stroke-width="${sel ? 5 : 3.5}"${dashed ? ' stroke-dasharray="7 5"' : ''}/>` +
        '<circle cx="30" cy="30" r="8.5" fill="#ffffff"/></svg>';
      pinUriCache[k] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }
    return pinUriCache[k];
  }
  const pinIconStyles = {}, pinTextStyles = {};
  const firstLine = (t) => { const l = String(t || '').split(/\r?\n/)[0].trim(); return l.length > 32 ? l.slice(0, 31) + '…' : l; };
  const pinLayer = new ol.layer.Vector({
    source: pinSource, updateWhileAnimating: true, updateWhileInteracting: true,
    style: (f, res) => {
      const kind = f.get('kind'), p = f.get('pin'), sel = f === pinOpen, dashed = kind !== 'own';
      const k = (dashed ? 'd' : '') + (sel ? 's' : '');
      if (!pinIconStyles[k]) pinIconStyles[k] = new ol.style.Style({ image: new ol.style.Icon({ src: pinUri(dashed, sel), scale: sel ? 0.6 : 0.5, anchor: [0.5, 0.96] }) });
      const out = [pinIconStyles[k]];
      // Le texte sous l'épingle, dès qu'on est un peu rapproché
      const label = kind === 'draft' ? '' : firstLine(p.txt);
      if (label && zoomForRes(res) >= 2) {
        if (!pinTextStyles[label]) pinTextStyles[label] = new ol.style.Style({ text: new ol.style.Text({
          text: label, offsetY: 7, textBaseline: 'top',
          font: '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
          fill: new ol.style.Fill({ color: '#ffffff' }), stroke: new ol.style.Stroke({ color: 'rgba(10, 20, 28, 0.85)', width: 3.2 })
        }) });
        out.push(pinTextStyles[label]);
      }
      return out;
    }
  });
  map.addLayer(pinLayer);
  applyPinsVisible();   // au-dessus des points et des noms

  function refreshPins() {
    pinSource.clear(true);
    pinSource.addFeatures(pins.map(p => pinFeature(p, 'own')));
    if (temp) pinSource.addFeature(temp);
    updateCounts();
    if (mode === 'pins') renderPinsList();
  }

  // Nom du quartier / de la ville et du comté sous une épingle
  let regionPolys = null;
  function placeName(p) {
    if (!regionPolys) regionPolys = REGIONS.map(r => ({ r, g: (regionGeom[r.id] || []).map(poly => new ol.geom.Polygon(poly)) }));
    const c = [p.x, -p.y];
    let best = null, county = null;
    for (const it of regionPolys) {
      if (!it.g.some(g => g.intersectsCoordinate(c))) continue;
      if (it.r.n === 1) county = it.r;
      else if (!best || it.r.n > best.n) best = it.r;
    }
    return [best, county].filter(Boolean).map(r => r.t).join(' · ');
  }
  const PIN_ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-6.2-6-11a6 6 0 0 1 12 0c0 4.8-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>';
  const pinUrl = (p) => location.origin + location.pathname + '#epingle=' + p.x + ',' + p.y + (p.txt ? ',' + encodeURIComponent(p.txt) : '');

  // --- Fiche d'une épingle (bulle sur ordinateur, bas d'écran sur téléphone) ---
  function pinCardHtml(f, state) {
    const p = f.get('pin'), kind = f.get('kind');
    const place = placeName(p);
    const title = p.txt ? `<h3 class="pin-txt">${esc(p.txt)}</h3>` : '<h3 class="pin-txt none">Épingle sans texte</h3>';
    const head = (t) => `<button class="close" aria-label="Fermer"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="body noimg"><div class="cat-line"><span class="badge pin-b">${PIN_ICO}</span>${t}</div>`;
    if (state === 'edit') {
      return head(kind === 'draft' ? 'Nouvelle épingle' : 'Modifier l\'épingle') +
        `<textarea class="pin-text" maxlength="${PIN_MAX}" placeholder="Ton petit texte (facultatif)">${esc(p.txt)}</textarea>
        <div class="pin-hint">Entrée pour enregistrer, Maj + Entrée pour aller à la ligne</div>
        <div class="pin-actions two"><button data-pa="cancel">Annuler</button><button data-pa="save" class="primary">Enregistrer</button></div></div>`;
    }
    if (state === 'shared') {
      return head('Épingle partagée') + title + `<div class="region">${esc(place)}</div>
        <div class="pin-actions two"><button data-pa="ignore">Ignorer</button><button data-pa="keep" class="primary">Enregistrer sur ma carte</button></div></div>`;
    }
    return head('Épingle') + title + `<div class="region">${esc(place)}</div>
      <div class="pin-actions"><button data-pa="edit">✎ Modifier</button><button data-pa="share">↗ Partager</button><button data-pa="del">✕ Supprimer</button></div>
      <div class="share-msg" aria-live="polite"></div></div>`;
  }

  function openPinCard(f, state, msg) {
    // Une fiche de lieu ouverte se ferme sans bruit
    if (popupFeature !== null) {
      popupFeature = null;
      if (selectedId !== null) { selectedId = null; poiLayer.changed(); }
      refreshPoints(); setHash('');
    }
    // Ouvrir une autre épingle abandonne le brouillon ou l'épingle reçue en cours
    if (temp && temp !== f) { pinSource.removeFeature(temp); temp = null; }
    pinOpen = f;
    const phone = isPhone();
    (phone ? popupEl : sheetEl).classList.add('hidden');
    if (phone) popup.setPosition(undefined);
    cardEl = phone ? sheetEl : popupEl;
    cardEl.innerHTML = pinCardHtml(f, state);
    cardEl.classList.remove('hidden');
    cardEl.scrollTop = 0;
    popupEl.classList.toggle('pin-card', !phone);
    cardEl.querySelector('.close').onclick = closePopup;
    pinLayer.changed();
    if (msg) { const el = cardEl.querySelector('.share-msg'); if (el) { el.textContent = msg; el._t = setTimeout(() => { el.textContent = ''; }, 4000); } }

    const coord = f.getGeometry().getCoordinates();
    if (phone) {
      // On garde l'épingle visible au-dessus de la fiche
      setTimeout(() => {
        const sheetH = sheetEl.getBoundingClientRect().height;
        const size = map.getSize(); if (!size) return;
        const px = map.getPixelFromCoordinate(coord);
        const wantY = Math.max(70, (size[1] - sheetH) / 2 + 20);
        const dy = px[1] - wantY, dx = px[0] - size[0] / 2;
        if (Math.abs(dy) > 4 || Math.abs(dx) > 4) {
          const res = view.getResolution(), ctr = view.getCenter();
          view.animate({ center: [ctr[0] + dx * res, ctr[1] - dy * res], duration: 250 });
        }
      }, 60);
    } else {
      popup.setPosition(coord);
      setTimeout(() => {
        const r = popupEl.getBoundingClientRect(), vw = window.innerWidth;
        const sideW = sideOpen() ? 310 : 0;
        let dx = 0, dy = 0;
        if (r.top < 14) dy = r.top - 14;
        if (r.left < sideW + 14) dx = r.left - (sideW + 14);
        if (r.right > vw - 14) dx = r.right - (vw - 14);
        if (dx || dy) {
          const res = view.getResolution(), ctr = view.getCenter();
          view.animate({ center: [ctr[0] + dx * res, ctr[1] - dy * res], duration: 250 });
        }
      }, 80);
    }
    if (state === 'edit') {
      const ta = cardEl.querySelector('.pin-text');
      ta.onkeydown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); savePin(); }
        if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
      };
      setTimeout(() => { try { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {} }, 30);
    }
  }
  // Appelée à chaque fermeture de fiche : retire le brouillon ou l'épingle reçue non enregistrés
  function pinCardClosed() {
    if (!pinOpen && !temp) return;
    const wasShared = temp && temp.get('kind') === 'shared';
    if (temp) { pinSource.removeFeature(temp); temp = null; }
    pinOpen = null;
    popupEl.classList.remove('pin-card');
    pinLayer.changed();
    if (wasShared) setHash('');
  }
  // Après un enregistrement : on reconstruit la couche et on rouvre la fiche de l'épingle
  function reopenPin(id, msg) {
    temp = null; pinOpen = null;
    refreshPins();
    const nf = pinSource.getFeatures().find(x => x.get('pin').id === id);
    if (nf) openPinCard(nf, 'view', msg);
  }
  function savePin() {
    const f = pinOpen; if (!f) return;
    const ta = cardEl.querySelector('.pin-text');
    const p = f.get('pin');
    p.txt = ta ? ta.value.trim().slice(0, PIN_MAX) : p.txt;
    p.t = Date.now();
    if (f.get('kind') !== 'own') { p.id = newPinId(); pins.push(p); }
    savePins();
    reopenPin(p.id);
  }
  function cancelEdit() {
    if (!pinOpen) return;
    if (pinOpen.get('kind') === 'draft') closePopup(); else openPinCard(pinOpen, 'view');
  }
  function onPinAction(e) {
    const b = e.target.closest('[data-pa]');
    if (!b || !pinOpen) return;
    const f = pinOpen, p = f.get('pin'), a = b.dataset.pa;
    if (a === 'save') savePin();
    else if (a === 'cancel') cancelEdit();
    else if (a === 'edit') openPinCard(f, 'edit');
    else if (a === 'share') shareLink(pinUrl(p), (firstLine(p.txt) || 'Épingle') + ' · Leonida', cardEl.querySelector('.share-msg'));
    else if (a === 'del') {
      // Deux temps : le premier clic demande confirmation
      if (!b.classList.contains('danger')) {
        b.classList.add('danger'); b.textContent = 'Confirmer ?';
        clearTimeout(b._t); b._t = setTimeout(() => { b.classList.remove('danger'); b.textContent = '✕ Supprimer'; }, 4000);
        return;
      }
      pins = pins.filter(x => x.id !== p.id);
      savePins(); closePopup(); refreshPins();
    }
    else if (a === 'ignore') closePopup();
    else if (a === 'keep') {
      p.id = newPinId(); p.t = Date.now(); pins.push(p);
      savePins(); setHash('');
      reopenPin(p.id, 'Épingle enregistrée sur ta carte.');
    }
  }
  popupEl.addEventListener('click', onPinAction);
  sheetEl.addEventListener('click', onPinAction);

  function startNewPin(coord) {
    closePopup();
    const p = { id: null, x: Math.round(coord[0]), y: Math.round(-coord[1]), txt: '', t: 0 };
    temp = pinFeature(p, 'draft');
    pinSource.addFeature(temp);
    try { if (navigator.vibrate) navigator.vibrate(25); } catch (e) {}
    openPinCard(temp, 'edit');
  }
  function goToPin(f, state) {
    if (isPhone()) setSide(false);
    targetRes = null;
    const res = Math.min(view.getResolution(), resForZoom(4.6));
    view.animate({ center: f.getGeometry().getCoordinates(), resolution: res, duration: 450 }, () => openPinCard(f, state));
  }
  // Lien reçu : #epingle=x,y,texte
  function receiveSharedPin(x, y, rawTxt) {
    let txt = rawTxt;
    try { txt = decodeURIComponent(rawTxt); } catch (e) {}
    txt = txt.slice(0, PIN_MAX);
    if (x < PAN_LIMIT[0] || x > PAN_LIMIT[2] || -y < PAN_LIMIT[1] || -y > PAN_LIMIT[3]) { setHash(''); return; }
    // Déjà sur ma carte ? On l'ouvre simplement.
    const mine = pinSource.getFeatures().find(f => { const p = f.get('pin'); return f.get('kind') === 'own' && Math.abs(p.x - x) <= 2 && Math.abs(p.y - y) <= 2 && p.txt === txt; });
    if (mine) { setHash(''); goToPin(mine, 'view'); return; }
    closePopup();
    temp = pinFeature({ id: null, x, y, txt, t: 0 }, 'shared');
    pinSource.addFeature(temp);
    goToPin(temp, 'shared');
  }

  // --- Liste des épingles (onglet du panneau) ---
  function renderPinsList() {
    const tip = '<div class="pin-tip">Appui long sur la carte (ou clic droit) pour poser une épingle.</div>';
    if (!pins.length) { marksListEl.innerHTML = `<div class="empty">${MODE_EMPTY.pins}</div>`; return; }
    marksListEl.innerHTML = tip + pins.slice().sort((a, b) => b.t - a.t).map(p =>
      `<div class="mk" data-pin="${esc(p.id)}"><span class="badge pin-b">${PIN_ICO}</span>
        <div><div class="t">${p.txt ? esc(firstLine(p.txt)) : '<span style="color:var(--muted)">Épingle sans texte</span>'}</div><div class="s">${esc(placeName(p))}</div></div></div>`).join('');
  }
  marksListEl.addEventListener('click', (e) => {
    const it = e.target.closest('[data-pin]');
    if (!it) return;
    const f = pinSource.getFeatures().find(x => x.get('pin').id === it.dataset.pin);
    if (f) goToPin(f, 'view');
  });

  // --- Appui long (doigt ou souris) et clic droit ---
  const LONG_MS = 550;
  let lpTimer = 0, lpStart = null, lpSuppress = false;
  const lpPointers = new Set();
  const lpCancel = () => { clearTimeout(lpTimer); lpStart = null; };
  viewport.addEventListener('pointerdown', (e) => {
    lpPointers.add(e.pointerId);
    lpCancel();
    lpSuppress = false;
    if (lpPointers.size > 1) return;                          // pincement : pas d'épingle
    if (e.pointerType === 'mouse' && e.button !== 0) return;  // le clic droit passe par contextmenu
    if (e.target.closest && e.target.closest('.popup')) return;
    lpStart = [e.clientX, e.clientY];
    const px = map.getEventPixel(e);
    lpTimer = setTimeout(() => {
      lpStart = null; lpSuppress = true;
      startNewPin(map.getCoordinateFromPixel(px));
    }, LONG_MS);
  });
  viewport.addEventListener('pointermove', (e) => {
    if (lpStart && Math.hypot(e.clientX - lpStart[0], e.clientY - lpStart[1]) > 8) lpCancel();
  });
  const lpEnd = (e) => { lpPointers.delete(e.pointerId); lpCancel(); };
  window.addEventListener('pointerup', lpEnd);
  window.addEventListener('pointercancel', lpEnd);
  viewport.addEventListener('contextmenu', (e) => {
    if (e.target.closest && e.target.closest('.popup')) return;   // menu normal dans une fiche (copier…)
    e.preventDefault();
    if (lpSuppress) return;                 // l'appui long vient déjà de poser une épingle
    if (lpStart) { lpCancel(); lpSuppress = true; }   // appui long tactile (Android) : on le prend ici
    startNewPin(map.getCoordinateFromPixel(map.getEventPixel(e)));
  });

  refreshPins();

  // --- Bouton EN / FR : bascule la langue des fiches, listes et noms de la carte ---
  const langEl = document.getElementById('lang');
  function syncLangBtn() {
    langEl.querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.dataset.lang === lang));
    if (!TR) langEl.style.display = 'none';
  }
  function setLang(l) {
    if (l === lang || (l === 'fr' && !TR)) return;
    lang = l;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyLangData();
    searchIndex = null;
    const folded = [...listEl.querySelectorAll('.grp.collapsed')].map(g => g.dataset.g);
    buildPanel();
    listEl.prepend(placeBox);
    folded.forEach(id => { const g = listEl.querySelector('.grp[data-g="' + id + '"]'); if (g) g.classList.add('collapsed'); });
    searchEl.dispatchEvent(new Event('input'));
    labelLayer.changed();
    if (mode !== 'all') renderMarksList();
    if (popupFeature) openPopup(popupFeature);
    syncLangBtn();
  }
  langEl.addEventListener('click', (e) => { const b = e.target.closest('button[data-lang]'); if (b) setLang(b.dataset.lang); });
  syncLangBtn();

  buildPanel();
  listEl.prepend(placeBox);
  refreshPoints();

  rebuildView(true);   // limites de zoom adaptées à la fenêtre + dernière vue (ou vue d'ensemble)
  setTimeout(handleHash, 0);   // lien vers un lieu ou marques partagées
  mapEl.focus();
})();
</script>
